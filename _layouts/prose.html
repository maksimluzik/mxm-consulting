<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" class="no-js">
  {%- include head.html -%}
  <body class="site-body {{ page.layout }}">
    {%- include header.html -%}
    <main id="main" class="site-main" aria-label="Main content">
      <div class="prose-hero">
        <div class="mxm-container">
          <h1>{{ page.title | split: " - " | first }}</h1>
        </div>
      </div>
      <div class="mxm-container prose-body">
        {{ content }}
      </div>
    </main>
  {%- include footer.html -%}
  <script>document.documentElement.classList.remove('no-js');</script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/blueprint.js' | relative_url }}" defer></script>
  </body>
</html>
