<header class="site-header engineered-nav" role="banner">
  <div class="mxm-container nav-container">
    <div class="brand-cluster">
      <a class="brand-link" href="{{ "/" | relative_url }}" aria-label="MXM Consulting Home">
        <img class="brand-logo-img brand-logo-dark" src="{{ '/assets/img/mxm-consulting-logo-dark.svg' | relative_url }}" alt="MXM Consulting" width="266" height="25" decoding="async" />
        <img class="brand-logo-img brand-logo-light" src="{{ '/assets/img/mxm-consulting-logo-light.svg' | relative_url }}" alt="MXM Consulting" width="266" height="25" decoding="async" />
      </a>
    </div>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav id="primary-nav" class="nav-links" aria-label="Primary">
      <a href="{% if page.url == '/' %}#advisory{% else %}{{ '/' | relative_url }}#advisory{% endif %}" class="nav-item">Advisory</a>
      <a href="{% if page.url == '/' %}#architecture{% else %}{{ '/' | relative_url }}#architecture{% endif %}" class="nav-item">Architecture</a>

      <a href="{% if page.url == '/' %}#manifesto{% else %}{{ '/' | relative_url }}#manifesto{% endif %}" class="nav-item">Manifesto</a>
      
      <div class="nav-action-wrapper">
        <a href="{% if page.url == '/' %}#conversion{% else %}{{ '/' | relative_url }}#conversion{% endif %}" class="btn-nav-primary">
          <span>Request Review or Inquire</span>
          <svg class="icon-nav-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Toggle light or dark theme" title="Toggle theme">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
